categories:
  - id: build-planning
    name: Build Planning
    description: Planners, damage calculators, gem and passive-tree tools.
  - id: trade
    name: Trade
    description: Searching, pricing, price-check overlays, bulk trade.
  - id: crafting
    name: Crafting
    description: Crafting simulators, mod databases, bench and essence tools.
  - id: atlas-and-maps
    name: Atlas and Maps
    description: Atlas planners, map mod checkers, layout guides.
  - id: loot-filters
    name: Loot Filters
    description: Filter editors, filter distributions, sound packs.
  - id: overlays-and-companions
    name: Overlays and Companions
    description: In-game overlays not covered elsewhere; timers, lab, log parsers.
  - id: economy-and-data
    name: Economy and Data
    description: League economy trackers, ladders, datamined game data.
  - id: leveling-and-guides
    name: Leveling and Guides
    description: Leveling trackers, gem progression, quest tools.
  - id: community
    name: Community
    description: Wikis, Discords, build aggregators.
  - id: league-specific
    name: League Specific
    description: Tools built for a single league mechanic; expect them to go quiet once the league ends.

# ---------------------------------------------------------------------------
# All URLs below were supplied by the site maintainer.
# Descriptions for Exile Compass, Scalpel and Exile-UI come from their
# repositories, read on 2026-09-05. The rest are written from general
# knowledge of the tool and are worth a skim before launch.
# ---------------------------------------------------------------------------

tools:
  - id: exile-compass
    name: Exile Compass
    description: >-
      In-game overlay that tracks campaign progress, imports Path of Building builds, writes regex
      stash searches, times runs, and takes voice commands.
    url: https://exilecompass.com/
    games: [poe1, poe2]
    category: overlays-and-companions
    tags: [overlay, campaign-tracker, regex, timer, voice-commands]
    platforms: [windows, linux]
    pricing: free
    openSource: true
    source: https://github.com/juddisjudd/exilecompass
    byMaintainer: true
    editorsPick: true
    status: active
    lastVerified: 2026-09-05
    notes: PoE2 gets the full feature set; PoE1 support is focused on levelling.

  - id: scalpel
